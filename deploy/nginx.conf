# nginx site for the ferrifuzz docs (static Docusaurus build, served from the domain root).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ferrifuzz-docs
#   sudo ln -s /etc/nginx/sites-available/ferrifuzz-docs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d docs.example.com        # HTTPS; certbot edits this file
#
# Replace docs.example.com with your domain, and match DOCS_URL used at build time.

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;

    root /var/www/ferrifuzz-docs;
    index index.html;

    # Pages are built as /docs/foo/index.html; links point at /docs/foo.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Webpack assets have content hashes in their names: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must be re-checked so a redeploy shows up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
