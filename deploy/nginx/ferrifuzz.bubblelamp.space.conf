# ferrifuzz docs — ferrifuzz.bubblelamp.space (static Docusaurus build at the domain root)
#
# Install (repo cloned on the VPS, nginx + certbot installed, DNS A record pointing here):
#   sudo mkdir -p /var/www/ferrifuzz-docs && sudo chown "$USER" /var/www/ferrifuzz-docs
#   sudo certbot certonly --nginx -d ferrifuzz.bubblelamp.space
#   sudo cp deploy/nginx/ferrifuzz.bubblelamp.space.conf /etc/nginx/sites-available/ferrifuzz.bubblelamp.space
#   sudo ln -sf /etc/nginx/sites-available/ferrifuzz.bubblelamp.space /etc/nginx/sites-enabled/ferrifuzz.bubblelamp.space
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   curl -sI http://ferrifuzz.bubblelamp.space/       → 301, Location: https://ferrifuzz.bubblelamp.space/
#   curl -sI https://ferrifuzz.bubblelamp.space/docs  → 200
#   curl -sI https://ferrifuzz.bubblelamp.space/nope  → 404
#
# server_name must match DOCS_URL used at build time (deploy/deploy-docs.sh).

# Cache policy by final URI. Defined here (not with add_header inside location blocks)
# because a location-level add_header would drop every server-level header below.
map $uri $ferrifuzz_docs_cache {
    ~*\.html$   "no-cache";                              # re-check pages so deploys show at once
    ~^/assets/  "public, max-age=31536000, immutable";   # webpack files carry content hashes
    default     "public, max-age=86400";                 # images, favicon, sitemap
}

server {
    listen 80;
    listen [::]:80;
    server_name ferrifuzz.bubblelamp.space;

    server_tokens off;

    # certbot renewals (HTTP-01) must keep working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ferrifuzz.bubblelamp.space$request_uri;
    }
}

server {
    # `listen ... http2` works on every nginx; 1.25.1+ only warns that `http2 on;` is preferred.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ferrifuzz.bubblelamp.space;

    ssl_certificate     /etc/letsencrypt/live/ferrifuzz.bubblelamp.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferrifuzz.bubblelamp.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ferrifuzz-docs;
    index index.html;

    access_log /var/log/nginx/ferrifuzz-docs.access.log;
    error_log  /var/log/nginx/ferrifuzz-docs.error.log;

    # Don't advertise the nginx version.
    server_tokens off;

    # Pages are built as /docs/foo/index.html; links point at /docs/foo/.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # Never serve dotfiles (e.g. a stray .git or .env copied into the web root).
    location ~ /\. {
        deny all;
    }

    add_header Cache-Control $ferrifuzz_docs_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
